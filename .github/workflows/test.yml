name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.28" "pytest>=8" "starlette>=0.40" "uvicorn>=0.30"

      - name: Check the entrypoint script
        run: bash -n scripts/combined-entrypoint.sh

      - name: Run pytest
        run: pytest -q
