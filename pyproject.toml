[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodetool-wan2gp"
version = "0.1.0"
description = "Wan2GP nodes for Nodetool"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Matthias Georgi", email = "matti.georgi@gmail.com" }]
requires-python = ">=3.11"

# Deliberately small. This package talks to a Wan2GP process the user runs
# themselves, over MCP streamable HTTP. It never imports Wan2GP or mmgp, so it
# needs no torch, no diffusers, and no model runtime of its own.
#
# mcp 2.x moved its transports from httpx to httpx2, and the media transfers
# share the MCP client factory, so this package uses httpx2 directly as well.
dependencies = [
    "nodetool-core[audio]>=0.8.1",
    "httpx2>=2.13.1",
    "mcp>=2.3.0,<3",
]

# Node discovery: nodetool-core's worker reads this group and imports
# nodetool.nodes.<value>.
[project.entry-points."nodetool.namespaces"]
wan2gp = "wan2gp"

[project.urls]
Repository = "https://github.com/nodetool-ai/nodetool-wan2gp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
    "ty",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.env",
    "/.env.*",
    "/.pi-subagents/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nodetool"]
include = [
    "src/nodetool/package_metadata/*.json",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
