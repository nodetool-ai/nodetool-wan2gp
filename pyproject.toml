# This repository no longer ships a Python package. The Wan2GP nodes and the
# wangp provider are built into NodeTool. What remains is the combined image's
# token proxy and its tests.

[project]
name = "nodetool-wan2gp-combined"
version = "0.3.0"
description = "Tests and tooling for the combined WanGP MCP image"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long
]

[tool.pytest.ini_options]
testpaths = ["tests"]
