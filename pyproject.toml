[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodetool-wan2gp"
version = "0.1.0"
description = "Wan2GP nodes for Nodetool"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Matthias Georgi", email = "matti.georgi@gmail.com" }]
requires-python = ">=3.11"

# Deliberately small. This package talks to a Wan2GP process the user runs
# themselves, over MCP streamable HTTP. It never imports Wan2GP or mmgp, so it
# needs no torch, no diffusers, and no model runtime of its own.
dependencies = [
    "nodetool-core>=0.7.0",
    "httpx>=0.27",
    "mcp>=1.16.0",
]

[project.urls]
Repository = "https://github.com/nodetool-ai/nodetool-wan2gp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
    "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nodetool"]
include = [
    "src/nodetool/package_metadata/*.json",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
